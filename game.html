<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Goose Arcade - Execution Core</title>
    <style>
        body { background: #1e1e2e; color: #fff; font-family: sans-serif; text-align: center; margin: 0; padding: 20px; }
        .navigation-row { display: flex; justify-content: space-between; align-items: center; max-width: 900px; margin: 0 auto 20px auto; }
        .back-btn { padding: 10px 20px; background: #f38ba8; border: none; border-radius: 6px; cursor: pointer; color: #11111b; font-weight: bold; font-size: 14px; }
        .player-tag { font-size: 14px; color: #fab387; font-weight: bold; background: #313244; padding: 8px 14px; border-radius: 20px; }
        
        #game-area { max-width: 1000px; margin: 0 auto; }
        canvas { background: #f8f9fa; display: block; margin: 20px auto; border-radius: 8px; border: 4px solid #cdd6f4; box-shadow: 0 8px 24px rgba(0,0,0,0.5); width: 100%; max-width: 900px; height: auto; cursor: pointer; }

        .leaderboard-box { margin: 40px auto; background: #313244; padding: 20px; border-radius: 10px; max-width: 400px; text-align: left; }
        .leaderboard-box h3 { text-align: center; margin-top: 0; color: #f5e0dc; border-bottom: 2px solid #45475a; padding-bottom: 10px; }
        ul { list-style: none; padding: 0; margin: 0; }
        li { padding: 8px 0; border-bottom: 1px solid #45475a; display: flex; justify-content: space-between; }
    </style>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

    <div class="navigation-row">
        <button class="back-btn" onclick="goBackToArcade()">⬅ Return to Arcade Grid</button>
        <div id="playerTag" class="player-tag">Player Profile Status</div>
    </div>

    <div id="game-area">
        <h2 id="game-title">DINO RUNNER</h2>
        <p style="color: #a6adc8;">Controls: Click inside the canvas to start. Use <strong>Spacebar</strong> or <strong>Up Arrow</strong> to jump.</p>
        <canvas id="gameCanvas" width="800" height="250"></canvas>
    </div>

    <div class="leaderboard-box">
        <h3>Top Arcade Run Logs</h3>
        <ul id="leaderboard-list">
            <li>Syncing live leaderboard matrix...</li>
        </ul>
    </div>

    <script src="app.js"></script>
    <script>
        verifyAccess(); 

        const urlParams = new URLSearchParams(window.location.search);

        const userData = localStorage.getItem('goose_user');
        let activeUser = null;
        if (!userData) {
            window.location.href = 'index.html';
        } else {
            activeUser = JSON.parse(userData);
            document.getElementById('playerTag').innerText = `🎮 Active: ${activeUser.display_name}`;
        }

        // Live Supabase Production Configuration
        const SUPABASE_URL = 'https://xkyvyyjlexeadaqgexgw.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_ZytZF6HwieXZuAKcMNX_vQ_IjX8gduC';
        const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        async function fetchLiveLeaderboard() {
            const container = document.getElementById('leaderboard-list');

            try {
                const { data, error } = await supabase.from('leaderboards').select('display_name, score').order('score', { ascending: false }).limit(10);
                if (error) throw error;

                container.innerHTML = '';
                if(!data || data.length === 0) {
                    container.innerHTML = '<li>No public entries recorded yet. Be the first!</li>';
                    return;
                }
                data.forEach((row, i) => {
                    container.innerHTML += `<li><span>${i + 1}. ${row.display_name}</span> <strong>${row.score} pts</strong></li>`;
                });
            } catch(e) {
                container.innerHTML = '<li>Error sync-loading live metrics.</li>';
                console.error(e);
            }
        }

        async function submitHighScore(finalScore) {
            if (!activeUser) return;

            try {
                const { data: { session } } = await supabase.auth.getSession();
                if (!session) {
                    console.warn("Session expired or missing. Highscore not submitted.");
                    return;
                }

                const { error } = await supabase.from('leaderboards').insert({
                    user_id: session.user.id,
                    display_name: activeUser.display_name,
                    score: finalScore
                });
                
                if (error) throw error;
                fetchLiveLeaderboard();
            } catch(err) {
                console.error("Score submit tracking error:", err.message);
            }
        }

        function goBackToArcade() {
            const key = urlParams.get('key') || getDailySecret();
            window.location.href = `arcade.html?key=${key}`;
        }

        // --- CORE DINO GAME MECHANICS ENGINE ---
        const canvas = document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");

        let score = 0;
        let gameTime = 0;
        let isPlaying = false;
        let obstacles = [];
        let gameSpeed = 6;

        const dino = { 
            x: 80, 
            y: 180, 
            width: 25, 
            height: 45, 
            gravity: 0.7, 
            velocity: 0, 
            jumpForce: -13, 
            isGrounded: true 
        };

        window.addEventListener("keydown", (e) => {
            if ((e.code === "Space" || e.code === "ArrowUp") && dino.isGrounded && isPlaying) {
                dino.velocity = dino.jumpForce;
                dino.isGrounded = false;
            }
        });

        canvas.addEventListener("click", () => { 
            if (!isPlaying) resetGame(); 
        });

        function spawnObstacle() {
            let sizeHeight = Math.random() * (50 - 25) + 25;
            obstacles.push({ 
                x: canvas.width, 
                y: 225 - sizeHeight, 
                width: 20, 
                height: sizeHeight 
            });
        }

        function resetGame() {
            score = 0; 
            obstacles = []; 
            gameSpeed = 6; 
            dino.y = 180; 
            dino.velocity = 0; 
            dino.isGrounded = true; 
            isPlaying = true;
            gameLoop();
        }

        function gameLoop() {
            if (!isPlaying) return;
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // Ground line build
            ctx.strokeStyle = "#585b70"; 
            ctx.lineWidth = 3;
            ctx.beginPath(); 
            ctx.moveTo(0, 225); 
            ctx.lineTo(canvas.width, 225); 
            ctx.stroke();

            // Physics execution 
            dino.velocity += dino.gravity; 
            dino.y += dino.velocity;
            
            if (dino.y >= 180) { 
                dino.y = 180; 
                dino.velocity = 0; 
                dino.isGrounded = true; 
            }
            
            // Draw Player Dino
            ctx.fillStyle = "#f38ba8"; 
            ctx.fillRect(dino.x, dino.y, dino.width, dino.height);

            gameTime++;
            if (gameTime % 80 === 0) { 
                spawnObstacle(); 
                gameSpeed += 0.3; 
            }

            for (let i = obstacles.length - 1; i >= 0; i--) {
                let obs = obstacles[i]; 
                obs.x -= gameSpeed;
                
                // Draw Cacti
                ctx.fillStyle = "#a6e3a1"; 
                ctx.fillRect(obs.x, obs.y, obs.width, obs.height);

                // Collision computation
                if (dino.x < obs.x + obs.width && dino.x + dino.width > obs.x && dino.y < obs.y + obs.height && dino.y + dino.height > obs.y) {
                    isPlaying = false;
                    ctx.fillStyle = "rgba(0, 0, 0, 0.6)"; 
                    ctx.fillRect(0, 0, canvas.width, canvas.height);
                    
                    ctx.fillStyle = "#f38ba8"; 
                    ctx.font = "bold 32px sans-serif"; 
                    ctx.fillText("GAME OVER", canvas.width / 2 - 100, canvas.height / 2);
                    
                    ctx.fillStyle = "#cdd6f4";
                    ctx.font = "16px sans-serif";
                    ctx.fillText("Click Canvas to Try Again", canvas.width / 2 - 90, canvas.height / 2 + 40);
                    
                    submitHighScore(score);
                    return;
                }
                
                if (obs.x + obs.width < 0) { 
                    obstacles.splice(i, 1); 
                    score += 10; 
                }
            }

            // UI HUD Output
            ctx.fillStyle = "#1e1e2e"; 
            ctx.font = "bold 20px monospace"; 
            ctx.fillText(`SCORE: ${score}`, 25, 40);
            
            requestAnimationFrame(gameLoop);
        }

        function renderSplash() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.fillStyle = "#313244";
            ctx.font = "bold 24px sans-serif";
            ctx.fillText("CLICK BOX TO START RUNNING", canvas.width / 2 - 180, canvas.height / 2 + 10);
        }

        renderSplash();
        fetchLiveLeaderboard();
    </script>
</body>
</html>
