<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Goose Arcade - Multi Core</title>
    <style>
        body { 
            background: #1e1e2e; 
            color: #fff; 
            font-family: sans-serif; 
            text-align: center; 
            margin: 0; 
            padding: 20px; 
        }
        .navigation-row { 
            display: flex; 
            justify-content: flex-start; 
            align-items: center; 
            max-width: 900px; 
            margin: 0 auto 20px auto; 
        }
        .back-btn { 
            padding: 10px 20px; 
            background: #f38ba8; 
            border: none; 
            border-radius: 6px; 
            cursor: pointer; 
            color: #11111b; 
            font-weight: bold; 
            font-size: 14px; 
        }
        .back-btn:hover {
            background: #f5e0dc;
        }
        #game-area { 
            max-width: 900px; 
            margin: 0 auto; 
        }
        iframe { 
            display: block; 
            margin: 20px auto; 
            border-radius: 8px; 
            border: 4px solid #cdd6f4; 
            box-shadow: 0 8px 24px rgba(0,0,0,0.5); 
            width: 100%; 
            height: 550px; /* Increased slightly to fit the simulators comfortably */
            background: #ffffff; 
        }
        #game-controls {
            color: #a6adc8;
            font-size: 14px;
            margin-bottom: 10px;
        }
    </style>
</head>
<body>

    <div class="navigation-row">
        <button class="back-btn" onclick="goBackToArcade()">⬅ Return to Arcade Grid</button>
    </div>

    <div id="game-area">
        <h2 id="game-title">ARCADE CABINET</h2>
        <p id="game-controls">Loading controls...</p>
        
        <iframe src="" id="gameFrame" allow="fullscreen"></iframe>
    </div>

    <script src="app.js"></script>
    <script>
        try { verifyAccess(); } catch(e) {}

        function goBackToArcade() {
            const urlParams = new URLSearchParams(window.location.search);
            const key = urlParams.get('key') || 'arcade';
            window.location.href = `arcade.html?key=${key}`;
        }

        // --- MULTI-GAME ROUTING ENGINE ---
        // --- MULTI-GAME ROUTING ENGINE ---
        const urlParams = new URLSearchParams(window.location.search);
        const activeGame = urlParams.get('game') || 'dino'; 
        
        const gameFrame = document.getElementById('gameFrame');
        const gameTitle = document.getElementById('game-title');
        const gameControls = document.getElementById('game-controls');

        // Upgraded Repository Library with Full Physics Simulation Engine
        const gameLibrary = {
            dino: {
                title: "DINO RUNNER",
                url: "https://wayou.github.io/t-rex-runner/",
                controls: "Click inside the box and press <strong>Spacebar</strong> to start and jump."
            },
            snake: {
                title: "RETRO SNAKE CABINET",
                url: "https://achalrastogi.github.io/retro-snake-ai/",
                controls: "Use your <strong>Arrow Keys</strong> to steer. Avoid hitting walls or your own growing tail matrix."
            },
            flight: {
                title: "3D FULL-PHYSICS FLIGHT COCKPIT",
                url: "https://phuang17.github.io/SideProjects/FlightSimulator/index.html",
                controls: "<strong>Throttle:</strong> X to increase, Z to decrease. <strong>Pitch:</strong> Up/Down Arrows (Requires airspeed for lift!). <strong>Roll/Yaw:</strong> Left/Right Arrows."
            }
        };

        // Inject selected game profile into the cabinet
        if (gameLibrary[activeGame]) {
            gameTitle.innerText = gameLibrary[activeGame].title;
            gameControls.innerHTML = gameLibrary[activeGame].controls;
            gameFrame.src = gameLibrary[activeGame].url;
        } else {
            gameTitle.innerText = gameLibrary.dino.title;
            gameControls.innerHTML = gameLibrary.dino.controls;
            gameFrame.src = gameLibrary.dino.url;
        }
    </script>
    <script defer src="/_vercel/insights/script.js"></script>   
</body>
</html>
